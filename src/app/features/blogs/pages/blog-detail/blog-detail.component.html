<main class="news-detail-page container">
  <article class="news-detail px-md-5 mx-md-5">
    <div class="news-detail__media">
      <img [src]="blog.image" [alt]="blog.title">
      <span
        class="news-detail__share"
        [class.news-detail__share--rtl]="i18n.locale() === 'ar'"
        aria-hidden="true"
      >
        <img src="/images/icons/share.svg" alt="share icon">
      </span>
    </div>

    <div class="news-detail__content">
      <h1>{{ blog.title }}</h1>
      <p class="news-detail__author">{{ blog.author }}</p>
      <p class="news-detail__date">{{ blog.date }}</p>
      <p class="news-detail__summary">{{ blog.summary }}</p>
    </div>
  </article>
</main>
