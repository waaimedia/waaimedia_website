<section class="home-section contact">
  <div class="container">
    <header>
      <h2>{{ i18n.translations().contactTitle }}</h2>
      <p>{{ i18n.translations().contactDescription }}</p>
    </header>
    <div class="contact__grid">
      <div class="contact__details">
        <h3 class="contact__details-title">{{ i18n.translations().contactInfo }}</h3>
        @for (item of items; track item.labelKey) {
          <article>
            <span aria-hidden="true">
              <img [src]="'/images/icons/' + item.icon" alt="" />
            </span>
            <div>
              <h3>{{ i18n.translations()[item.labelKey] }}</h3>
              <p>{{ i18n.translations()[item.valueKey] }}</p>
            </div>
          </article>
        }
      </div>
      <section class="contact__map" [attr.aria-label]="i18n.translations().contactFindUs">
        <h3>{{ i18n.translations().contactFindUs }}</h3>
        <iframe
          [title]="i18n.translations().brandName + ' location'"
          [src]="mapUrl"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </section>
    </div>
  </div>
</section>
