<section class="home-section events">
  <div class="container events-wrap">
    <div class="events-heading">
      <h2>{{ i18n.translations().eventsTitle }}</h2>
      <div class="events-controls">
        <button #previousButton type="button" aria-label="Previous events">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6" /></svg>
        </button>
        <button #nextButton type="button" aria-label="Next events">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6" /></svg>
        </button>
      </div>
    </div>
    <div #eventsSwiper class="swiper events-carousel">
      <div class="swiper-wrapper">
        @for (item of items; track item.id) {
          <article class="swiper-slide event-card">
            <div
              class="event-media"
              aria-hidden="true"
              [style.background-image]="item.imageUrl ? 'url(' + item.imageUrl + ')' : null"
            ></div>
            <div class="event-card__content">
              <small>{{ item.category?.[i18n.locale()] }}</small>
              <h3>{{ item.title[i18n.locale()] }}</h3>
              <p>Date: {{ eventDates[item.id] }}</p>
              <p>Place: {{ item.description?.[i18n.locale()] }}</p>
            </div>
          </article>
        }
      </div>
    </div>
  </div>
</section>
