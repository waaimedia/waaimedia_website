<section class="home-video" aria-label="WAAI MEDIA video">
  @if (videoUrl) {
    <video
      class="home-video__media"
      [src]="videoUrl"
      [attr.poster]="posterUrl"
      preload="metadata"
      playsinline
      autoplay
      muted
      /* loop */
    ></video>
  } @else {
    <div class="home-video__fallback">
      <img [ngSrc]="logoSrc" width="100" height="87" alt="WAAI MEDIA" priority />
    </div>
  }
</section>
