<section class="home-video" [attr.aria-label]="i18n.translations().brandName + ' video'">
  @if (videoUrl) {
    <video
      class="home-video__media"
      [src]="videoUrl"
      [attr.poster]="posterUrl"
      preload="metadata"
      width="1600"
      height="270"
      playsinline
      autoplay
      [muted]="true"
      loop
    ></video>
  } @else {
    <div class="home-video__fallback">
      <img [ngSrc]="logoSrc" width="100" height="87" [alt]="i18n.translations().brandName" priority />
    </div>
  }
</section>
