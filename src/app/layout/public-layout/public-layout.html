<a class="skip-link" href="#main-content">{{ i18n.translations().skipToContent }}</a>
<app-top-bar />
<app-header />
<main id="main-content" class="public-main" tabindex="-1">
  <router-outlet />
</main>
<app-footer />

@if (backgroundMusic.enabled && backgroundMusic.url) {
  <audio
    #backgroundMusicPlayer
    [src]="backgroundMusic.url"
    [loop]="backgroundMusic.loop"
    preload="auto"
    hidden
  ></audio>
}
