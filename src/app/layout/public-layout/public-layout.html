<a class="skip-link" href="#main-content">{{ i18n.translations().skipToContent }}</a>
<app-top-bar />
<app-header />
<main id="main-content" class="public-main" tabindex="-1">
  <router-outlet />
</main>
<app-footer />

@if (backgroundMusic.settings().is_enabled && backgroundMusic.settings().audio_url; as audioUrl) {
  <audio
    #backgroundMusicPlayer
    [src]="audioUrl"
    [loop]="backgroundMusic.settings().is_loop"
    preload="auto"
    hidden
  ></audio>
}
