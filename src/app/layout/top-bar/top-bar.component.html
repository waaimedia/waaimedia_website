<div class="top-bar">
  <div class="top-bar__inner container">
    <p class="top-bar__date">
      <time [attr.datetime]="isoDate">{{ dateLabel() }}</time>
    </p>
    @if (socialLinks.length > 0) {
      <nav class="top-bar__social" [attr.aria-label]="i18n.translations().socialLinks">
        @for (social of socialLinks; track social.platform) {
          @if (social.href; as href) {
            <a
              [href]="href"
              target="_blank"
              rel="noopener noreferrer"
              [attr.aria-label]="socialLabel(social)"
            >
              <img [src]="'/images/icons/social/' + social.platform + '.svg'" alt="" />
            </a>
          } @else {
            <span
              class="top-bar__social-unavailable"
              role="img"
              [attr.aria-label]="
                socialLabel(social) +
                ': ' +
                i18n.translations().socialProfileUnavailable
              "
            >
              <img [src]="'/images/icons/social/' + social.platform + '.svg'" alt="" />
            </span>
          }
        }
      </nav>
    }
  </div>
</div>
